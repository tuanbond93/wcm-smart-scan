<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd5" />
      <stop offset="100%" stop-color="#00A19A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#00A19A" stroke-width="8" />

  <!-- Scanner targeting reticle corners -->
  <path d="M 96 176 L 96 116 L 156 116" fill="none" stroke="#00A19A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 416 176 L 416 116 L 356 116" fill="none" stroke="#00A19A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 96 336 L 96 396 L 156 396" fill="none" stroke="#00A19A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 416 336 L 416 396 L 356 396" fill="none" stroke="#00A19A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Barcode vertical stripes -->
  <rect x="136" y="156" width="18" height="170" rx="6" fill="#ffffff" />
  <rect x="174" y="156" width="32" height="170" rx="6" fill="#ffffff" />
  <rect x="226" y="156" width="14" height="170" rx="6" fill="#ffffff" />
  <rect x="260" y="156" width="28" height="170" rx="6" fill="#ffffff" />
  <rect x="308" y="156" width="16" height="170" rx="6" fill="#ffffff" />
  <rect x="344" y="156" width="32" height="170" rx="6" fill="#ffffff" />

  <!-- Neon Laser Horizontal Scan Line -->
  <line x1="76" y1="240" x2="436" y2="240" stroke="#00ffd5" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

  <!-- Branding Label Text -->
  <text x="256" y="440" text-anchor="middle" font-family="'Space Grotesk', 'Anton', sans-serif" font-size="44" font-weight="900" fill="#00A19A" letter-spacing="4">
    WCM SMART SCAN
  </text>
</svg>
